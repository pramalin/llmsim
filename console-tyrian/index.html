<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>llmsim console</title>
<style>
  /* CSS in index.html, not Tyrian-side inline styles for everything --
     `class` attribute confirmed working via a real Tyrian+Tailwind
     example (github.com/zetashift/tyrian-vite-tailwindcss-example),
     needing backticks in Main.scala since class is a Scala keyword.
     Real CSS selectors here avoid needing to verify any further new
     Tyrian attribute surface just to apply styling. */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 16px;
    color: #1a1a2e;
    background: #f7f8fa;
    line-height: 1.4;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    background: white;
  }

  th, td {
    padding: 6px 12px;
    text-align: left;
    border-bottom: 1px solid #e0e0e6;
  }

  th {
    background: #eef0f4;
    font-weight: 600;
    /* position: sticky on individual th cells, not thead itself --
       more consistently supported across browsers for table headers.
       z-index and an opaque background keep scrolled body content
       from showing through underneath. */
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .table-scroll {
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid #e0e0e6;
    border-radius: 4px;
  }

  .table-scroll table {
    margin: 0;
  }

  tbody tr {
    cursor: pointer;
  }

  tbody tr:hover {
    background: #f4f6fb;
  }

  /* A real, distinct marker for the selected row -- not just a
     background-color difference (the review's own explicit complaint
     about the earlier version), so it's still clear which row is
     selected even before considering color contrast/accessibility at
     all. */
  .row-selected {
    background-color: #dde6fb !important;
    border-left: 4px solid #4a67e0;
  }

  .outcome-responded { color: #1a7f37; font-weight: 600; }
  .outcome-rejected  { color: #c2410c; font-weight: 600; }
  .outcome-failed    { color: #b91c1c; font-weight: 600; }
  .outcome-cancelled { color: #6b7280; font-weight: 600; }

  button {
    padding: 6px 12px;
    margin: 2px 4px 2px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: white;
    cursor: pointer;
    font-size: inherit;
  }

  button:hover:not(:disabled) {
    background: #f0f2f7;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Overrides the general button styling above -- still a real
     <button> underneath (keyboard-focusable, Enter/Space-activatable),
     just visually plain so it doesn't look out of place sitting next
     to ordinary table cells. Focus is still visible via the browser's
     default outline, deliberately not suppressed -- removing focus
     indicators would undo the accessibility point of using a real
     button here in the first place. */
  .seq-button {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  input {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: inherit;
  }

  pre {
    background: #f4f4f8;
    padding: 8px 12px;
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  h3, h4 {
    margin: 12px 0 6px 0;
  }

  /* App shell -- gives the page real visual identity from the very
     first render, independent of whether any data has loaded yet.
     Previously everything on screen depended on fetched data, so the
     initial state was just bare "loading..." text with nothing
     establishing what the page even was. */
  .app-container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .app-header h1 {
    margin: 0 0 2px 0;
    font-size: 26px;
  }

  .app-tagline {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 16px;
  }

  /* Row layout for the script-status badge + text via flexbox on the
     parent -- not inline-block on each child, which would need an
     unconfirmed <span> tag to get right; this achieves the same
     visual result using only the already-confirmed div + class
     pattern. */
  .script-status {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    font-size: 14px;
  }

  .status-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .status-badge-running {
    background: #d1fae5;
    color: #065f46;
  }

  .status-badge-exhausted {
    background: #fef3c7;
    color: #92400e;
  }

  .summary-cards {
    display: flex;
    gap: 12px;
    margin: 0 0 16px 0;
    flex-wrap: wrap;
  }

  .summary-card {
    background: white;
    border: 1px solid #e0e0e6;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 160px;
    flex: 1;
  }

  .summary-card-label {
    font-size: 12px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .summary-card-value {
    font-size: 26px;
    font-weight: 700;
    margin: 2px 0;
  }

  .summary-card-sub {
    font-size: 12px;
    color: #6b7280;
  }

  .control-panel {
    margin-bottom: 16px;
  }

  .action-status {
    display: inline-block;
    margin-left: 8px;
    font-size: 14px;
    color: #6b7280;
  }

  .action-status-success {
    color: #065f46;
  }

  .action-status-error {
    color: #b91c1c;
  }

  /* Consistent, intentional-looking treatment for every "nothing to
     show yet / something went wrong" message -- loading, empty
     journal, empty filter results, fetch errors -- instead of bare
     unstyled text, which was a real part of what made the initial
     page load feel unfinished. */
  .status-message {
    padding: 12px 16px;
    background: white;
    border: 1px solid #e0e0e6;
    border-radius: 6px;
    color: #6b7280;
  }

  .status-message-error {
    color: #b91c1c;
    border-color: #fca5a5;
    background: #fef2f2;
  }

  /* Confirmed missing from a previous delivery -- Main.scala already
     referenced these four classes, but the CSS defining them never
     actually reached the committed file. Real bug, caught by review,
     fixed here with actual verification this time, not just re-sent. */
  .filter-panel {
    margin-bottom: 12px;
  }

  .filter-label {
    display: inline-block;
    font-weight: 600;
    font-size: 13px;
    margin: 8px 8px 4px 0;
  }

  .filter-toggle {
    /* Inherits the general button rules already defined above --
       this selector exists so filter-toggle-active (below) has
       something concrete to override. */
  }

  .filter-toggle-active {
    background: #4a67e0;
    color: white;
    border-color: #4a67e0;
  }

  .filter-toggle-active:hover,
  button.filter-toggle-active:hover {
    /* button:hover:not(:disabled) (defined earlier, general button
       styling) has higher specificity than a bare class selector --
       :not(:disabled) still counts as a pseudo-class toward
       specificity even though it reads as incidental, and the extra
       button type selector tips it over .filter-toggle-active:hover
       alone. Result: on hover, the light-gray general background was
       winning over the intended blue, while the active button's white
       text color (not contested by that rule) stayed -- white text on
       near-white background is exactly what "obscured" describes.
       Matching specificity here (also including button) and
       re-asserting color explicitly is the actual fix, not just
       re-declaring the same losing rule. */
    background: #3d55ba;
    color: white;
  }

  /* Shown as a banner over still-visible (possibly stale) data when a
     refresh fails -- distinct from .status-message-error, which
     replaces the whole view; this one sits on top of data that's
     still there. */
  .stale-warning {
    padding: 8px 12px;
    margin-bottom: 8px;
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
    border-radius: 6px;
    font-size: 13px;
  }

  .last-refreshed {
    display: inline-block;
    margin-left: 8px;
    font-size: 13px;
    color: #6b7280;
  }

  .tab-bar {
    display: flex;
    gap: 4px;
    margin: 8px 0 12px 0;
    border-bottom: 1px solid #e0e0e6;
  }

  .tab-button {
    border: none;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    background: none;
    margin: 0;
    padding: 6px 10px;
  }

  .tab-button:hover {
    background: #f4f6fb;
  }

  .tab-button-active {
    font-weight: 600;
    border-bottom: 2px solid #4a67e0;
    color: #4a67e0;
  }
</style>
</head>
<body>
<div id="myapp"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
