services:
  llmsim:
    build: .
    ports:
      - "8089:8089"
    environment:
      # Point this at a different fully-qualified ScriptSource object to
      # boot with a different script -- e.g. llmsim.scripts.WeatherFlow.
      # Override from the shell: LLMSIM_SCRIPT=llmsim.scripts.WeatherFlow docker compose up
      - LLMSIM_SCRIPT=${LLMSIM_SCRIPT:-llmsim.scripts.Default}
