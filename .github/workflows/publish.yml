name: Publish Docker images

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Publishes TWO images to GHCR:
#   ghcr.io/<owner>/llmsim-build:<version>  -- the compiled engine, meant to
#     be used as a FROM base by other projects that add their own script
#     file(s) and re-run `sbt assembly` (see README: "Using llmsim in an
#     app's end-to-end tests" -> Pattern A).
#   ghcr.io/<owner>/llmsim:<version>        -- the standalone runtime image
#     with the bundled example scripts, for trying llmsim on its own.
#
# Both also get a floating `:latest` tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag (strip leading "v")
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the reusable build-stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llmsim-build:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/llmsim-build:latest

      - name: Build and push the standalone runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llmsim:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/llmsim:latest
